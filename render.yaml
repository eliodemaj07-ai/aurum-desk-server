services:
  - type: web
    name: aurum-desk-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PAYPAL_ME_URL
        value: "https://paypal.me/AurumDesk"
      - key: PUBLIC_CONTACT_EMAIL
        value: "eliodemaj07@gmail.com"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: "eliodemaj07@gmail.com"
      - key: SMTP_FROM
        value: "Aurum Desk <eliodemaj07@gmail.com>"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_PASS
        sync: false
      - key: DEFAULT_DOWNLOAD_URL
        value: "https://aurumdesk.com/download-coming-soon"
